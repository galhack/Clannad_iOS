name: Source-only checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/tests -v
      - run: python3 tools/check_source_only.py .
      - run: git diff --check
