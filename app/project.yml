# XcodeGen project of the Apple port: one application target for iPhone,
# iPad, Vision Pro and Mac Catalyst.  Generate with
# tools/apple/gen_project.sh (or `xcodegen generate --spec app/project.yml`);
# the .xcodeproj itself is not kept in git.
#
# The engine is the Rust static library vendored at engine/siglus_rs, built
# into ../build/Siglus.xcframework ((ios-arm64, ios-arm64-simulator,
# macos-arm64-maccatalyst, xros-arm64, xros-arm64-simulator)). Swift imports
# the C header directly so Release dead stripping retains its entry points.
name: Clannad
options:
  bundleIdPrefix: org.local
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    visionOS: "1.0"
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${CLANNAD_TEAM}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.8"
    CURRENT_PROJECT_VERSION: "9"
    SWIFT_VERSION: "5.0"
    GCC_C_LANGUAGE_STANDARD: gnu99
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  ClannadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.local.clannad.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Clannad
  ClannadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.local.clannad.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Clannad
  Clannad:
    type: application
    supportedDestinations: [iOS, visionOS, macCatalyst]
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${CLANNAD_BUNDLE_ID}
        PRODUCT_NAME: Clannad
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../engine/siglus_rs/platform/ios/SiglusLauncher/Headers/siglus.h
        GENERATE_INFOPLIST_FILE: NO
        # The restricted build sandbox used by the port's scripts cannot run
        # the Swift compiler's macro sandbox (SwiftUI's @State/@Environment),
        # so the compiler runs without its own sandbox.  The sources are the
        # trusted ones in this repository; normal Xcode builds ignore the risk.
        OTHER_SWIFT_FLAGS: "-disable-sandbox"
        # The Rust staticlib is a plain C archive: it needs the C++ runtime,
        # zlib, libiconv and the resolver, like every Rust Apple staticlib.
        # Extra symbols the Lead reports missing are appended here.
        OTHER_LDFLAGS: ["-lc++", "-lz", "-liconv", "-lresolv"]
        # Lets `xcodebuild` find the xcframework at link time as well as the
        # dependency reference below.
        FRAMEWORK_SEARCH_PATHS:
          - $(SRCROOT)/../build
        TARGETED_DEVICE_FAMILY[sdk=iphone*]: "1,2"
        TARGETED_DEVICE_FAMILY[sdk=macosx*]: "2,6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
        CODE_SIGN_STYLE[sdk=macosx*]: Manual
        DEVELOPMENT_TEAM[sdk=macosx*]: ""
        PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]: ""
        TARGETED_DEVICE_FAMILY[sdk=xr*]: "7"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xr*]: AppIconVision
        CODE_SIGN_ENTITLEMENTS: ""
        ENABLE_BITCODE: NO
        GCC_OPTIMIZATION_LEVEL[config=Debug]: 2
    dependencies:
      - framework: ../build/Siglus.xcframework
        embed: false
        codeSign: false
        link: true
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: AVFoundation.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: GameController.framework
schemes:
  Clannad:
    build:
      targets:
        Clannad: all
  ClannadChecks:
    build:
      targets:
        Clannad: all
    test:
      targets:
        - ClannadTests
        - ClannadUITests
